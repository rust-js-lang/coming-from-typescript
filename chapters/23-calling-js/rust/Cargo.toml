[package]
name = "chapter-23-calling-js"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# rust-js compiles with `--cfg=rust_js`.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(rust_js)"] }

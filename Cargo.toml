# coming-from-typescript: one crate per chapter, each compiled to JavaScript
# by rust-js and compared, input by input, with the same code in TypeScript.
[workspace]
members = ["chapters/01-the-same-function-twice/rust", "chapters/02-let-and-let-mut/rust", "chapters/03-numbers-know-their-kind/rust"]
# The pinned rust-js checkout, a submodule: not a member of this workspace.
exclude = ["rust-js"]
resolver = "3"
